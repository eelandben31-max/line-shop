<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桑好樣精選商城 & 推薦專區</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* 全站背景 */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; 
      padding: 20px; 
      background-color: #f4f6f8;
      background-image: linear-gradient(rgba(244, 246, 248, 0.90), rgba(244, 246, 248, 0.90)), url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #333; 
    }
    .card { 
      background: rgba(255, 255, 255, 0.96); 
      backdrop-filter: blur(10px);
      border-radius: 14px; 
      padding: 20px; 
      margin-bottom: 20px; 
      box-shadow: 0 8px 24px rgba(0,0,0,0.06); 
    }
    h2, h3 { margin-top: 0; color: #111; }
    .btn { 
      display: inline-block; 
      width: 100%; 
      box-sizing: border-box; 
      background: #06C755; 
      color: white; 
      border: none; 
      padding: 12px; 
      border-radius: 8px; 
      font-weight: bold; 
      font-size: 16px; 
      cursor: pointer; 
      text-align: center; 
    }
    .btn-share { background: #007aff; margin-top: 10px; }
    
    /* 商品外框與媒體展示 */
    .product-box {
      border: 1px solid #ebebeb;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #fff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    .video-container {
      position: relative;
      padding-bottom: 56.25%; /* 16:9 比例 */
      height: 0;
      overflow: hidden;
      background: #000;
    }
    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .product-img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
      display: block;
    }
    .product-content {
      padding: 14px;
    }
    .product-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
    }
    .badge { 
      background: #e8f5e9; 
      color: #2e7d32; 
      padding: 4px 8px; 
      border-radius: 4px; 
      font-size: 12px; 
      font-weight: bold; 
    }
  </style>
</head>
<body>

  <!-- 用戶與推薦人狀態 -->
  <div class="card">
    <h3 id="userGreeting">載入中...</h3>
    <p id="refInfo" style="font-size: 14px; color: #666;"></p>
    <button class="btn btn-share" onclick="copyMyReferralLink()">📋 複製桑好樣專屬推薦連結</button>
  </div>

  <!-- 精選商品展示區 -->
  <div class="card">
    <h3>🔥 桑好樣精選熱賣商品</h3>
    
    <!-- 商品 1：董事長年終尊榮精選體驗組（放 YouTube 影片） -->
    <div class="product-box">
      <div class="video-container">
        <iframe 
          src="https://www.youtube.com/embed/dar7A4GWE6w" 
          title="董事長年終尊榮精選體驗組 介紹影片" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
          allowfullscreen>
        </iframe>
      </div>
      <div class="product-content">
        <div style="font-weight: bold; font-size: 16px;">董事長年終尊榮精選體驗組</div>
        <div style="font-size: 13px; color: #777; margin-top: 4px;">直達深處舒緩緊繃，極致尊榮配方首選</div>
        <div class="product-footer">
          <div style="color: #e53935; font-weight: bold; font-size: 16px;">
            NT$ 1,200 <span class="badge">分潤 10%</span>
          </div>
          <button class="btn" style="width: auto; padding: 8px 16px;" onclick="submitOrder('董事長年終尊榮精選體驗組', 1200)">立即預訂</button>
        </div>
      </div>
    </div>

    <!-- 商品 2：桑好樣年度旗艦套餐一條龍（放 Postimage 圖片） -->
    <div class="product-box">
      <img class="product-img" src="https://i.postimg.cc/nzyyvDj9/794506175-1793005954831789.jpg" alt="桑好樣年度旗艦套餐一條龍">
      <div class="product-content">
        <div style="font-weight: bold; font-size: 16px;">桑好樣年度旗艦套餐一條龍</div>
        <div style="font-size: 13px; color: #777; margin-top: 4px;">全套尊榮諮詢與調理方案，完整專屬禮遇</div>
        <div class="product-footer">
          <div style="color: #e53935; font-weight: bold; font-size: 16px;">
            NT$ 3,600 <span class="badge">分潤 10%</span>
          </div>
          <button class="btn" style="width: auto; padding: 8px 16px;" onclick="submitOrder('桑好樣年度旗艦套餐一條龍', 3600)">立即預訂</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // 系統憑證配置
    const LIFF_ID = "2012228111-I5468Lal";
    const SUPABASE_URL = "https://ughhbhgtfabuelefraou.supabase.co";
    const SUPABASE_KEY = "sb_publishable_SGy0h-8SpjO9T5z6Y3qHXw__WkSg0WD";
    const LINE_ACCESS_TOKEN = "8xVh+ovOX7yjNkg7MAhnHLbni9KtkE2DAGV2NA15z6H7MH56N6Qfh4eJub4jHIt8bwkgfr9BLxE+tUCLUcw+Nd3i+w+u4oqOvqMKbpqZ1ZR61emkkpm7RbYp7TFgfoM60YY4CLivZQWa3fETJW2ooQdB04t89/10/w1cDnyi1FU=";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;

    async function initApp() {
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const profile = await liff.getProfile();
      currentUser = profile;
      document.getElementById('userGreeting').innerText = `您好，${profile.displayName}！`;

      // 取得推薦人參數 (?ref=xxxx)
      const urlParams = new URLSearchParams(window.location.search);
      const referrerId = urlParams.get('ref');

      if (referrerId && referrerId !== profile.userId) {
        document.getElementById('refInfo').innerText = `已鎖定推薦人獎勵綁定`;
      }

      // 登錄或更新會員資料
      await supabaseClient.from('users').upsert({
        line_user_id: profile.userId,
        display_name: profile.displayName,
        referrer_id: (referrerId && referrerId !== profile.userId) ? referrerId : null
      });
    }

    // 複製推薦連結
    function copyMyReferralLink() {
      if (!currentUser) return;
      const shareUrl = `https://liff.line.me/${LIFF_ID}?ref=${currentUser.userId}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("專屬推薦連結已複製！發給朋友即可享有分潤！\n" + shareUrl);
      });
    }

    // 下單並觸發推播
    async function submitOrder(productName, price) {
      if (!currentUser) return;

      const confirmBuy = confirm(`確定要預訂【${productName}】（NT$ ${price}）嗎？`);
      if (!confirmBuy) return;

      // 查詢當前用戶綁定的推薦人
      const { data: userData } = await supabaseClient
        .from('users')
        .select('referrer_id')
        .eq('line_user_id', currentUser.userId)
        .single();

      const finalReferrerId = userData ? userData.referrer_id : null;

      // 1. 寫入訂單
      await supabaseClient.from('orders').insert({
        buyer_id: currentUser.userId,
        buyer_name: currentUser.displayName,
        product_name: productName,
        amount: price,
        referrer_id: finalReferrerId
      });

      // 2. 若有推薦人，寫入 10% 分潤並推播通知
      if (finalReferrerId) {
        const bonus = Math.round(price * 0.1);
        await supabaseClient.from('commissions').insert({
          referrer_id: finalReferrerId,
          buyer_id: currentUser.userId,
          amount: bonus,
          status: 'pending'
        });

        // 發送 LINE 推播給推薦人
        try {
          await fetch('https://api.line.me/v2/bot/message/push', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${LINE_ACCESS_TOKEN}`
            },
            body: JSON.stringify({
              to: finalReferrerId,
              messages: [{
                type: 'text',
                text: `🎉【桑好樣分潤入帳】\n恭喜！好友 ${currentUser.displayName} 剛預訂了【${productName}】。\n您已獲得預計分潤：NT$ ${bonus} 元！`
              }]
            })
          });
        } catch (e) {
          console.error("推播發送失敗", e);
        }
      }

      alert("預訂成功！已將明細傳送至系統！");
    }

    initApp();
  </script>
</body>
</html>
